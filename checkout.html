<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | COCONEST</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/branding/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="flow-page">
  <header class="navbar navbar-expand-xl navbar-coconest"><div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html"><img src="assets/images/branding/logo.svg" alt="COCONEST Pure Coconut Living" width="176" height="44"></a>
    <div class="d-flex align-items-center gap-2 d-xl-none"><button class="theme-toggle-btn" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button><button class="rtl-toggle-btn" aria-label="Toggle RTL"><span class="rtl-text">RTL</span></button><a class="nav-icon-btn" href="cart.html" aria-label="Shopping cart"><i class="fa-solid fa-bag-shopping"></i><span class="nav-badge cart-badge">0</span></a><button class="navbar-toggler border-0 p-1" type="button" data-bs-toggle="collapse" data-bs-target="#flowNav" aria-label="Toggle navigation"><i class="fa-solid fa-bars-staggered fs-4 text-forest"></i></button></div>
    <nav class="collapse navbar-collapse" id="flowNav"><ul class="navbar-nav mx-auto mb-2 mb-lg-0"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li><li class="nav-item"><a class="nav-link" href="products.html">Products</a></li><li class="nav-item"><a class="nav-link" href="services.html">Services</a></li><li class="nav-item"><a class="nav-link" href="pricing.html">Pricing</a></li><li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li><li class="nav-item"><a class="nav-link active" href="cart.html">Basket</a></li></ul><div class="nav-actions d-none d-xl-flex"><a class="nav-icon-btn" href="cart.html" title="Shopping cart"><i class="fa-solid fa-bag-shopping"></i><span class="nav-badge cart-badge">0</span></a><button class="theme-toggle-btn" title="Toggle theme"><i class="fa-solid fa-moon"></i><span class="theme-text">Dark</span></button><button class="rtl-toggle-btn" title="Toggle RTL"><span class="rtl-text">RTL</span></button></div></nav>
  </div></header>
  <main class="flow-main"><div class="container">
    <div class="flow-heading"><div class="flow-eyebrow">Step 1 of 3 · Checkout</div><h1 class="font-serif">Almost there.</h1><p>Tell us where to send order updates. This demo keeps everything in your browser.</p></div>
    <div class="flow-stepper"><span class="is-active"><i class="fa-solid fa-circle-check"></i> Contact</span><i class="fa-solid fa-chevron-right"></i><span>Address</span><i class="fa-solid fa-chevron-right"></i><span>Payment</span></div>
    <div class="row g-4 align-items-start"><div class="col-lg-7"><section class="flow-card"><h2 class="font-serif mb-4">Contact details</h2><form id="checkoutContactForm" class="flow-form" novalidate><div class="row g-3"><div class="col-md-6"><label class="form-label" for="fullName">Full name *</label><input class="form-control" id="fullName" name="fullName" autocomplete="name" required></div><div class="col-md-6"><label class="form-label" for="email">Email address *</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div><div class="col-md-6"><label class="form-label" for="phone">Phone number *</label><input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel" required></div><div class="col-md-6"><label class="form-label" for="company">Company <span class="fw-normal text-muted">(optional)</span></label><input class="form-control" id="company" name="company" autocomplete="organization"></div><div class="col-12"><label class="form-label" for="notes">Order notes <span class="fw-normal text-muted">(optional)</span></label><textarea class="form-control" id="notes" name="notes" placeholder="Anything our sourcing team should know?"></textarea></div></div><button class="btn btn-coconest btn-primary-coconest mt-4" type="submit">Continue to Address <i class="fa-solid fa-arrow-right ms-2"></i></button></form></section></div><div class="col-lg-5"><aside class="flow-card flow-summary"><h2 class="font-serif">Order Summary</h2><div id="checkoutSummaryItems"></div><div class="flow-total-lines"><div><span>Subtotal</span><strong id="checkoutSummaryItemsSubtotal">$0.00</strong></div><div><span>Shipping</span><strong id="checkoutSummaryItemsShipping">Free</strong></div><div class="flow-grand-total"><span>Total</span><strong id="checkoutSummaryTotal">$0.00</strong></div></div></aside></div></div>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/main.js"></script>
</body></html>
